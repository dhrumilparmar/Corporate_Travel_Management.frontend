<div class="bg-surface text-on-surface font-body antialiased min-h-screen flex items-center justify-center selection:bg-secondary-container selection:text-on-secondary-container">
  <!-- Decorative Background Layer -->
  <div class="fixed inset-0 bg-surface-container-low pointer-events-none z-[-1]"></div>

  <!-- Main Content Canvas -->
  <main class="w-full max-w-4xl px-6 py-4 relative">
    <div class="w-full mx-auto">
      <!-- Header Section -->
      <header class="mb-12 text-center md:text-left">
        <div class="flex items-center justify-center md:justify-start gap-3 mb-4">
          <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
          <p class="text-secondary font-label text-sm tracking-wide font-semibold">Step 1 of 2: Trip Details</p>
        </div>
        <h2 class="font-headline text-[2.5rem] leading-tight text-primary font-bold tracking-tight">
          Create New Travel Request
        </h2>
      </header>

      <!-- Form Card -->
      <div class="bg-surface-container-lowest rounded-xl p-6 md:p-10 shadow-[0px_20px_40px_rgba(0,27,60,0.08)]">
        <form [formGroup]="requestForm" (ngSubmit)="nextStep()" class="flex flex-col gap-10">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
            <!-- Destination Field -->
            <div class="col-span-1 md:col-span-2 flex flex-col gap-2">
              <label class="font-label text-sm font-medium text-on-surface-variant flex items-center gap-2" for="destination">
                Destination
              </label>
              <div class="relative">
                <span class="material-symbols-outlined absolute left-4 top-3.5 text-outline">location_city</span>
                <input
                  id="destination"
                  formControlName="destination"
                  type="text"
                  placeholder="Enter City, Airport, or Office Location"
                  class="w-full bg-surface-container-highest text-on-surface font-body px-4 py-3 pl-12 rounded-t-[0.375rem] border-0 border-b-2 border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:border-secondary transition-all placeholder:text-outline-variant"
                />
              </div>
              <p *ngIf="requestForm.get('destination')?.touched && requestForm.get('destination')?.invalid" class="text-xs text-error font-medium">
                Destination is required.
              </p>
            </div>

            <!-- Dates Field -->
            <div class="flex flex-col gap-2">
              <label class="font-label text-sm font-medium text-on-surface-variant">
                Travel Dates
              </label>
              <div class="flex items-center gap-3 bg-surface-container-highest rounded-t-[0.375rem] px-2 focus-within:bg-surface-container-lowest focus-within:ring-0 focus-within:border-b-2 focus-within:border-secondary transition-all border-b-2 border-transparent">

                <input
                  formControlName="startDate"
                  type="date"
                  class="w-full bg-transparent border-0 focus:ring-0 py-3 text-on-surface placeholder:text-outline-variant font-body"
                />
                <span class="material-symbols-outlined text-outline-variant text-sm">arrow_forward</span>
                <input
                  formControlName="endDate"
                  type="date"
                  class="w-full bg-transparent border-0 focus:ring-0 py-3 text-on-surface placeholder:text-outline-variant font-body text-right"
                />
              </div>
              <p *ngIf="(requestForm.get('startDate')?.touched && requestForm.get('startDate')?.invalid) || (requestForm.get('endDate')?.touched && requestForm.get('endDate')?.invalid)" class="text-xs text-error font-medium">
                Travel start and end dates are required.
              </p>
            </div>

            <!-- Purpose Field -->
            <div class="flex flex-col gap-2">
              <label class="font-label text-sm font-medium text-on-surface-variant" for="purpose">
                Primary Purpose
              </label>
              <div class="relative">
                <select
                  id="purpose"
                  formControlName="purpose"
                  class="w-full bg-surface-container-highest text-on-surface font-body px-4 py-3 appearance-none rounded-t-[0.375rem] border-0 border-b-2 border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:border-secondary transition-all"
                >
                  <option class="text-outline-variant" disabled value="">Select Reason</option>
                  <option value="client">Client Meeting</option>
                  <option value="conference">Conference / Event</option>
                  <option value="internal">Internal Project</option>
                  <option value="other">Other</option>
                </select>
                <span class="material-symbols-outlined absolute right-4 top-3.5 text-outline pointer-events-none">expand_more</span>
              </div>
              <p *ngIf="requestForm.get('purpose')?.touched && requestForm.get('purpose')?.invalid" class="text-xs text-error font-medium">
                Please select a purpose.
              </p>
            </div>
          </div>

          <!-- Divider -->
          <div class="h-px w-full bg-surface-variant rounded-full"></div>

          <!-- Notes Section -->
          <div class="flex flex-col gap-2">
            <label class="font-label text-sm font-medium text-on-surface-variant" for="notes">
              Additional Justification (Optional)
            </label>
            <textarea
              id="notes"
              formControlName="notes"
              rows="3"
              placeholder="Provide any necessary context for approval..."
              class="w-full bg-surface-container-highest text-on-surface font-body px-4 py-3 rounded-t-[0.375rem] border-0 border-b-2 border-transparent focus:ring-0 focus:bg-surface-container-lowest focus:border-secondary transition-all resize-none placeholder:text-outline-variant"
            ></textarea>
          </div>

          <!-- Footer Actions -->
          <div class="mt-2 flex items-center justify-end gap-4">
          <button class="px-6 py-3 font-label font-medium bg-secondary-container text-on-secondary-container rounded-[0.375rem] hover:bg-secondary-fixed-dim transition-colors">
                Save Draft
            </button>


<button
  type="submit"
  class="px-8 py-3 font-label font-medium bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-[0.375rem] flex items-center gap-2 hover:opacity-90 transition-opacity shadow-[0px_8px_16px_rgba(0,32,69,0.15)]"
>
  Next: Budget Details
  <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
